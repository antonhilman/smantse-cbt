name: Build SMANTSE CBT APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          sed -i 's/rootProject.name = "SMANTSE CBT"/rootProject.name = "smantse-cbt"/' settings.gradle
          sed -i 's/@mipmap\/ic_launcher/@android:drawable\/sym_def_app_icon/g' app/src/main/AndroidManifest.xml
          sed -i '/android:roundIcon/d' app/src/main/AndroidManifest.xml
          touch app/proguard-rules.pro
          gradle assembleDebug --stacktrace

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SMANTSE-CBT-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
